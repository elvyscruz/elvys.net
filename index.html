<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elvys Cruz</title>
    <style>
      body {
        font-family: 'Segoe UI', sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f9f9f9;
        color: #444;
      }

      header {
        background-color: #f0f0f0;
        color: #333;
        padding: 3rem 1rem;
        text-align: center;
      }

      header h1 {
        margin: 0;
        font-size: 2.5rem;
        font-weight: normal;
      }

      .container {
        max-width: 800px;
        margin: 2rem auto;
        padding: 0 1rem;
      }

      .section {
        margin-bottom: 2rem;
      }

      h2 {
        border-bottom: 1px solid #ccc;
        padding-bottom: 0.5rem;
        color: #555;
        font-weight: 500;
      }

      p {
        font-size: 1.1rem;
        line-height: 1.6;
      }

      .social {
        text-align: center;
        margin-top: 2.5rem;
      }

      .social a {
        margin: 0 1rem;
        color: #666;
        text-decoration: none;
        font-size: 2rem;
        transition: color 0.3s ease;
      }

      .social a:hover {
        color: #000;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Elvys Cruz</h1>
    </header>

    <div class="container">
      <div class="section">
        <h2>Sobre mí</h2>
        <p>
          Especialista en tecnología educativa, enfocado en crear soluciones
          digitales que mejoren el acceso, la interacción y la calidad del
          aprendizaje en entornos virtuales.
        </p>
      </div>

      <div class="section social">
        <a
          href="https://www.linkedin.com/in/elvyscruz/"
          target="_blank"
          title="LinkedIn"
          >🔗</a
        >
        <a href="https://github.com/elvyscruz" target="_blank" title="GitHub"
          >🐱</a
        >
        <a href="mailto:elvyscruz@gmail.com" title="Email">📧</a>
      </div>
    </div>
  </body>
</html>
